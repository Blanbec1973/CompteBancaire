# ----- Serveur -----
server.port=8080

# ----- Application Info -----
app.version=@project.version@

# ----- H2 (Base de donnees memoire) -----
#spring.datasource.url=jdbc:h2:mem:compterhey;DB_CLOSE_DELAY=-1
# --spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=heynerr
#spring.datasource.password=
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# ----- PostgreSQL -----
spring.datasource.url=jdbc:postgresql://localhost:5432/comptebancaire
spring.datasource.username=heynerrichard
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----- LOGGING (SLF4J/Logback) -----
logging.level.root=INFO
logging.level.org.heynerr=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http.converter.json=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# File logging (can be overridden by -D flag or env variable)
# Default: ./logs/app.log (relative to working directory)
# Override with: -Dlogging.file.name=/custom/path/app.log
logging.file.name=logs/app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

